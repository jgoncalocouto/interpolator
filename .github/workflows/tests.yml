name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install app and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check column picker search and keyboard behavior
        run: node --test tests/column_picker.test.mjs
      - name: Run all tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: python -m coverage report
      - name: Write coverage reports
        if: always()
        run: |
          python -m coverage xml --fail-under=0
          python -m coverage html --fail-under=0
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
